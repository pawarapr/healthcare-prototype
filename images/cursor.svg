.button { cursor: pointer; }   /* pointing hand */
h1 { cursor: help; }           /* arrow with a question mark */
.card { cursor: grab; }        /* open hand */
/* Custom cursors */
body {
  cursor: url("../images/cursor.svg") 12 12, auto;
}

.button,
.link {
  cursor: url("../images/cursor-hover.svg") 16 16, pointer;
}